
services:
  postgres:
    container_name: 'lingo_db'
    image: 'postgres:latest'
    env_file:
      - env/postgres.env
    ports:
      - '1506:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  application:
    build: .
    container_name: lingo_app
    env_file: [env/postgres.env]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: